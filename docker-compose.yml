services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-olx_ads}
      POSTGRES_USER: ${POSTGRES_USER:-olx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olx_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  moderation-api:
    build:
      context: ./backend/api-mock
    ports:
      - "8787:8787"
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-olx_ads}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-olx_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-olx_password}
      MODERATION_BASE_URL: http://moderation-api:8787
    depends_on:
      postgres:
        condition: service_healthy
      moderation-api:
        condition: service_healthy

volumes:
  postgres_data:
